name: Gates

# The four checks AGENTS.md §8 says a session is not finished without, run where
# forgetting them is caught rather than discovered later.
#
# Nothing enforced these before: the Vercel build is a plain `next build` with
# `typescript.ignoreBuildErrors: true` in next.config.mjs, so a type error, a
# failing test and a forgotten changelog entry all shipped identically — green.
#
# `changelog:check` is the cheapest and the most easily forgotten, so it runs
# first: a release whose version disagrees across CHANGELOG.md, STATUS.md,
# package.json and src/lib/version.ts is a broken release history, and the
# public /changelog page renders it without complaint.
#
# No database, no secrets. Every check here is static. Migrations are applied by
# the Vercel build itself — dev on a push to `dev`, production on a launch to
# `main` — after this same gate runs again there (scripts/vercel-build.ts).
#
# `main` is protected (AGENTS.md §4a): it accepts a pull request from `dev`
# only, and only once `gates`, `release-source` and `Vercel` (the dev
# deployment, which migrated the dev database) are green.

on:
  push:
    # `dev` is what dev.expeditop.fr is built from, and it is pushed to
    # directly — so it is checked on push, not only when it reaches a PR.
    branches: [main, dev]
  pull_request:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. The action errors out when it is given
      # two answers, and `packageManager` in package.json is now the single
      # one — which is also what corepack reads locally, so CI and a laptop
      # can no longer drift onto different majors. `migrate.yml` failed for
      # exactly the opposite reason: it asked here and package.json was silent.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Ordered cheapest-first so an obvious miss fails in seconds.
      - name: Release records agree (AGENTS.md §8)
        run: pnpm changelog:check

      - name: Typecheck
        # The real gate: next.config.mjs sets ignoreBuildErrors, so a production
        # build will happily ship code that does not typecheck.
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  # A launch reaches production from `dev` and nowhere else: that is the branch
  # whose deployment migrated the dev database and was checked on
  # dev.expeditop.fr. A pull request into `main` from any other branch would
  # skip both. Required by the branch protection on `main`.
  release-source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: A launch to main comes from dev
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "main" ] && [ "$HEAD" != "dev" ]; then
            echo "::error::Pull requests into main come from dev only (this one is from '$HEAD'). Merge it into dev, check it on dev.expeditop.fr, then open dev → main. AGENTS.md §4a."
            exit 1
          fi
          echo "ok: $HEAD → $BASE"
