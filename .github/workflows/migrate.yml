name: Migrate database

# THE FALLBACK, NOT THE ROUTE. Since 2.95.1 migrations are applied by the Vercel
# build itself: the dev database on a push to `dev`, production on a launch to
# `main`, each after the gate and a destructive-statement check
# (scripts/vercel-build.ts, AGENTS.md §4a). Run this by hand only when the
# operator asks — say, to re-apply after a build that failed mid-migration —
# and read why that build failed first.
#
# History: the Vercel build used to be a plain `next build`, so a deploy shipped
# code that expected columns the database might not have — which is how
# `withdrawals` reached production as a 500 and a blank "My earnings" page
# (CLAUDE.md, "Two migrations had never run anywhere").
#
# The production connection string lives here as a secret because a laptop has
# none. `vercel env pull` cannot help: every
# production variable is marked Sensitive, so it returns `[SENSITIVE]` rather
# than a value, and a laptop therefore has no way to reach the production
# database — deliberately. `src/db/migrate.ts` enforces the same thing from the
# other side: it refuses any target that is not an allow-listed development
# database unless MIGRATE_TARGET=production is set explicitly.
#
# Requires, in repo Settings → Secrets:
#   - POSTGRES_URL_PRODUCTION   the production (Supabase) connection string,
#                               the same value as POSTGRES_URL in Vercel
#                               Production. Prefer the NON-POOLING/direct URL:
#                               migrations take DDL locks and a pooled
#                               connection can drop them mid-statement.
#   - POSTGRES_URL_DEV          the development database's direct URL (the Neon
#                               `dev` branch), plus the repo VARIABLE
#                               DEV_DB_REFS naming its endpoint id. Only the
#                               `dev` choice reads them.
#
# Order still matters on the automatic route: migrate FIRST, then serve. The
# build does exactly that, and a migration is additive in this repo, so the
# old code still serving tolerates the new columns.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which database to migrate
        required: true
        type: choice
        default: production
        options:
          - production
          - dev
      confirm:
        description: Type "migrate" to confirm
        required: true
        type: string

# Two migration runs at once would race for the same DDL locks and the same
# journal rows.
concurrency:
  group: migrate-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refuse an unconfirmed run
        if: inputs.confirm != 'migrate'
        run: |
          echo "::error::Type \"migrate\" in the confirm box to run this."
          exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The journal is what the migrator walks — not the directory — so a .sql
      # that was never registered is silently skipped. Fail here rather than
      # report a successful migration that applied nothing.
      - name: Check every migration is registered
        run: pnpm vitest run src/db/__tests__/migrations-journal.test.ts

      - name: Apply migrations
        env:
          TARGET: ${{ inputs.environment }}
          POSTGRES_URL_PRODUCTION: ${{ secrets.POSTGRES_URL_PRODUCTION }}
          POSTGRES_URL_DEV: ${{ secrets.POSTGRES_URL_DEV }}
          DEV_DB_REFS: ${{ vars.DEV_DB_REFS }}
        run: |
          # `dev` deliberately does NOT set MIGRATE_TARGET: without it
          # src/db/migrate.ts refuses anything that is not an allow-listed
          # development database, so the production URL pasted into the dev
          # secret is refused instead of migrated. The dev database is normally
          # migrated by its own Vercel build (scripts/vercel-build.ts); this is
          # for doing it by hand.
          if [ "$TARGET" = "production" ]; then
            export POSTGRES_URL="$POSTGRES_URL_PRODUCTION" MIGRATE_TARGET=production
            unset DEV_DB_REFS
            secret=POSTGRES_URL_PRODUCTION
          else
            export POSTGRES_URL="$POSTGRES_URL_DEV"
            secret=POSTGRES_URL_DEV
          fi
          if [ -z "$POSTGRES_URL" ]; then
            echo "::error::secrets.$secret is not set — see the header of this workflow."
            exit 1
          fi
          set -o pipefail
          pnpm db:migrate 2>&1 | tee migrate.log

      # The run summary shows annotations, and the step log needs repo admin
      # rights — so four failed runs in a row said only "Process completed with
      # exit code 1", and the cause had to be reconstructed from outside. This
      # puts the database's own words on the summary page. Connection strings
      # are redacted before anything is printed.
      - name: Say why the migration failed
        if: failure()
        run: |
          [ -f migrate.log ] || exit 0
          sed -E 's#postgres(ql)?://[^[:space:]"]+#<redacted-url>#g' migrate.log \
            | grep -E "Error|error:|message:|detail:|hint:|code:|FATAL|refus|insecure" \
            | head -8 \
            | while IFS= read -r line; do echo "::error title=Migration failed::$line"; done
