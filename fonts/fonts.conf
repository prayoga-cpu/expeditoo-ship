<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Read by fontconfig on behalf of librsvg, which is how sharp draws the text
  in the location band burned onto shipment photos
  (src/server/services/photo-stamp.service.ts).

  Why this file exists at all: fontconfig finds fonts through the host, and a
  Vercel serverless runtime has no system fonts, so the band rendered there as
  a black bar with no letters. FONTCONFIG_PATH points at this directory and
  this file points back at the two TTFs beside it.

  prefix="relative" resolves against the directory holding this file, not the
  process's working directory - the same config then works from a repo
  checkout, from `next start`, and from /var/task in a function, none of which
  agree on where the fonts are.
-->
<fontconfig>
  <dir prefix="relative">.</dir>

  <!-- The only writable path in a serverless filesystem. Without it fontconfig
       falls back to ~/.cache, fails, and complains on every render. -->
  <cachedir>/tmp/.fontconfig</cachedir>

  <!-- Inter is the only family here, so the generics must land on it: a
       fallback stack naming Helvetica would otherwise resolve to nothing. -->
  <alias><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Inter</family></prefer></alias>
</fontconfig>
